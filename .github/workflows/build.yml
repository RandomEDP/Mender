name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            app: build/Mender_artefacts/Release/Mender.exe
          - name: macOS
            os: macos-latest
            app: build/Mender_artefacts/Release/Mender.app
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload plug-in
        uses: actions/upload-artifact@v4
        with:
          name: Mender-Plugin-${{ matrix.name }}
          # Uploading the parent folder keeps the Mender.vst3 bundle folder intact.
          path: build/MenderPlugin_artefacts/Release/VST3

      - name: Upload standalone editor
        uses: actions/upload-artifact@v4
        with:
          name: Mender-Editor-${{ matrix.name }}
          path: ${{ matrix.app }}
